name: CI

# Avoid running multiple jobs for the same branch
# in case of updates.
concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (true) }}

# Run on pull requests and push events to master only
on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

permissions:
  contents: read

jobs:
  # Style Checking: Linux and Python version only.
  style:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Check for changes only on files changed by the PR/push
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - uses: tj-actions/changed-files@v47
      id: changed-files

    # Cache CI packages
    - uses: actions/cache@v5
      id: cache-precommit
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-hooks-v2-${{ 
          hashFiles('**/.pre-commit-config.yaml') }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Installing pre-commit
      run: |
        python -m pip install pre-commit

    - name: Installing pre-commit hooks (cached)
      if: steps.cache-precommit.outputs.cache-hit != 'true'
      run: |
        pre-commit install --install-hooks

    - name: Run style checking via pre-commit
      run: |
        pre-commit run --show-diff-on-failure --files ${{ steps.changed-files.outputs.all_changed_files }}

  # Cache pip & python dependencies for Linux runner
  # since it is used in most actions.
  # Adapted from: https://medium.com/ai2-blog/python-caching-in-github-actions-e9452698e98d
    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  linux_prep:
    needs:
    - style
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/cache@v5
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-${{ env.pythonLocation }}-${{ matrix.python-version 
          }}-v2-${{ hashFiles('pyproject.toml') }}-${{ 
          hashFiles('**/ci-dependencies.txt') }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Install Python dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade --upgrade-strategy eager -r ci-dependencies.txt

  # Try building package:
  # - tarball on Linux
  # - wheels on all supported OSes and Linux, MacOS, and Windows
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  build:
    needs:
    - style
    - alpha_bridge_inputs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Package tarball
      run: |
        python -m build --sdist

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  build_wheels:
    needs:
    - style
    - alpha_bridge_inputs
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-rc.1"]
        exclude:
          # setup-python does not have a Windows ARM64 build before 3.11
        - os: windows-11-arm
          python-version: "3.10"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Build wheel
      run: |
        python -m build --wheel

    # - name: Archive wheels
    #   uses: actions/upload-artifact@v2
    #   with:
    #     name: biopython_wheels
    #     path: |
    #       dist/*whl
    #
    # - name: Fetch archived wheels from previous jobs
    #   uses: actions/download-artifact@v2
    #   with:
    #     name: biopython_wheels
    #     path: dist


  # Run tests in parallel across Linux, MacOS, and Windows
  # hosts (thus the three steps and not the single matrix entry).
  #
  # Linux tests install all the dev dependencies, while MacOS and Windows
  # tests install only numpy (lightweight version).
  # NOTE: PyPy only runs on Linux with minimal dependencies because it's running slowly.
  #
  # Tests trigger only of the style and build steps succeed.
  #

  # Linux is where the thorough tests run. Install all dependencies and run all (offline) tests.
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  test_linux:
    timeout-minutes: 20
    needs:
    - style
    - build
    - build_wheels
    - linux_prep
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:

    # Start MySQL server: required for some tests.
    - run: |
        sudo /etc/init.d/mysql start

    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # Retrieve cache to speed things up
    - uses: actions/cache@v5
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-${{ env.pythonLocation }}-${{ matrix.python-version 
          }}-v2-${{ hashFiles('pyproject.toml') }}-${{ 
          hashFiles('**/ci-dependencies.txt') }}

    - name: Install dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade --upgrade-strategy eager -r ci-dependencies.txt

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        CC="gcc -fsanitize=address -fsanitize=undefined -g" python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        PYTHONMALLOC=debug LD_PRELOAD="$(realpath "$(gcc -print-file-name=libasan.so)") $(realpath "$(gcc -print-file-name=libstdc++.so)")" ASAN_OPTIONS="detect_leaks=0" coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml
      shell: bash

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v6
      with:
        name: Linux GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  test_macos:
    timeout-minutes: 15
    needs:
    - style
    - build
    - build_wheels
    - alpha_bridge_inputs
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel coverage

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v6
      with:
        name: macOS GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  test_windows:
    timeout-minutes: 15
    needs:
    - style
    - build
    - build_wheels
    - alpha_bridge_inputs
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-11-arm]
        python-version: ["3.14"]
        include:
        - os: windows-2022
          python-version: "3.10"
          # setup-python does not have a Windows ARM64 build before 3.11
        - os: windows-11-arm
          python-version: "3.11"

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel coverage

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        coverage run --source Bio,BioSQL run_tests.py --offline
        coverage xml

    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v6
      with:
        name: ${{ matrix.os }} GitHub Actions ${{ matrix.python-version }}
        disable_search: true
        files: Tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  test_pypy:
    timeout-minutes: 20  # a little more time
    needs:
    - style
    - build
    - build_wheels
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [pypy-3.10]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install minimal Python dependencies
      run: |
        python -m pip install numpy

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Run test suite
      run: |
        cd Tests
        python run_tests.py --offline

  # Flag step
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  check_tests:
    needs:
    - test_linux
    - test_macos
    - test_windows
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo All tests passed.


  # Check and build (API) documentation if everything passes.
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  docs:
    needs:
    - check_tests
    - alpha_bridge_inputs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - uses: actions/cache@v5
      id: cache-pip
      with:
        path: ${{ env.pythonLocation }}
        key: ${{runner.os}}-${{ env.pythonLocation }}-${{ matrix.python-version 
          }}-v2-${{ hashFiles('pyproject.toml') }}-${{ 
          hashFiles('**/ci-dependencies.txt') }}

    - name: Install Python packaging tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade --upgrade-strategy eager -r .circleci/requirements-sphinx.txt

    - name: Debug Info
      run: |
        python -m pip list

    - name: Install from source
      run: |
        python -m pip install .

    - name: Make documentation
      run: |
        make -C Doc html
      shell: bash

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  cleanup_wheels:
    if: |-
      ${{ (always()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
    - build_wheels
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    steps:
    - uses: geekyeggo/delete-artifact@v6
      with:
        name: biopython_wheels
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && '372c71069d9d0e7c86af4e318ce212241c2d10dd' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/master' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          fb66bf5655e3b6f2e708ddf6c86eba762bda9285282da68f218fc39deb50550c
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_DEFAULT_PERMISSIONS: read
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
        \    \"\"\"GitHub prefixes callable job names with each caller's display name.\"\
        \"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in INPUT_CHECK_NAMES\n\
        \n\ndef input_identity(job):\n    for step in job.get(\"steps\", []):\n  \
        \      if step.get(\"conclusion\") != \"success\":\n            continue\n\
        \        name = step.get(\"name\", \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n\
        \            if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
        \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n         \
        \           return identity\n    return \"\"\n\n\ndef parent_has_work(get,
        repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
        head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\") !=
        \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
        ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
        parent workflow has no exact configuration commit\")\n    record = get(f\"\
        /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
        )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n \
        \   if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
        schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if is_input_check(job) and job.get(\"conclusion\"\
        ) == \"success\" and input_identity(job)\n    ]\n    return not guards or
        any(\n        job not in guards and job.get(\"conclusion\") != \"skipped\"\
        \ for job in jobs\n    )\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
        \                            else job[\"name\"] == job_name\n            \
        \            )\n                        and job.get(\"status\") == \"completed\"\
        \n                        and job.get(\"conclusion\") == \"success\"\n   \
        \                     and input_identity(job) == identity\n              \
        \      ):\n                        return False\n                if len(jobs)
        < 100:\n                    break\n                job_page += 1\n       \
        \ if len(runs[\"workflow_runs\"]) < 100:\n            return True\n      \
        \  page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n    event_payload
        = None\n    if event not in {\"schedule\", \"workflow_run\"}:\n        with
        open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\") as payload_file:\n\
        \            event_payload = json.load(payload_file)\n    inputs = {\n   \
        \     \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n        \"source_ref\"\
        : os.environ[\"AB_REF\"],\n        \"workflow_definition\": os.environ[\"\
        AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n        \"event_payload\"\
        : event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n   \
        \     \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n        \"\
        inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"default_workflow_permissions\"\
        : os.environ[\"AB_DEFAULT_PERMISSIONS\"],\n        \"runner_image\": [os.environ.get(\"\
        ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\")],\n        \"producer\"\
        : json.loads(os.environ.get(\"AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity
        = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
